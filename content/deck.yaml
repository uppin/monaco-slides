slides:
  - id: opening
    name: Designing Architectures that AI can work with
    label: THE THESIS
    title:
      - text: Designing Architectures
      - accent: that AI can work with
    description: From a local change to production evidence.
    code: introduction
    takeaway: Make correct changes ordinary.
    notes: >-
      [0:00–0:40 · 40 seconds]


      Introduce yourself. This talk is about the environment around AI coding, not a prompt
      recipe. We will follow an order-processing change from code to production.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
    author: true
  - id: context-cost
    name: Five lines of change. Half a repo of context.
    label: THE PROBLEM
    title:
      - text: Five lines of change.
      - accent: Half a repo of context.
    description: The hard part is often discovering what must remain true.
    code: introduction
    takeaway: Reduce the knowledge required to act safely.
    notes: >-
      [0:40–1:30 · 50 seconds]


      Ask the audience to recall a tiny change that required opening dozens of files.
      Distinguish the size of the diff from the amount of context needed to make it safely.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
        panel: context-burden
  - id: reasoning-budget
    name: Lower the intelligence a correct change requires.
    label: THE THESIS
    title:
      - text: Lower the intelligence
      - accent: a correct change requires.
    description: Make routine work accessible to smaller models. Give frontier models less
      accidental complexity.
    code: introduction
    takeaway: Spend reasoning on the problem.
    notes: >-
      [1:30–2:35 · 65 seconds]


      This is a design goal and an empirical hypothesis. Smaller models still have limits;
      better structure does not guarantee correctness. Compare representative tasks and retain
      the same acceptance bar.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
        panel: reasoning-budget
  - id: accepted-outcomes
    name: Optimize for accepted changes.
    label: MEASUREMENT
    title:
      - text: Optimize for
      - accent: accepted changes.
    description: Correctness, context, retries, elapsed time, and review effort.
    code: accepted-changes
    takeaway: Tokens per attempt are not the outcome.
    notes: >-
      [2:35–3:20 · 45 seconds]


      Use comparable tasks and record model, toolchain, and context. Include failed attempts and
      human corrections. No performance or token savings are claimed by this illustrative
      schema.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
  - id: cohesive-packages
    name: Small interface. Deep module.
    label: CODE DESIGN
    title:
      - text: Small interface.
      - accent: Deep module.
    description: Hide meaningful complexity. Keep related knowledge together.
    code: shallow-quote
    takeaway: Reduce what callers must know, not just file length.
    notes: |-
      [3:20–5:05 · 105 seconds]

      Small does not mean a package per function. Avoid forcing one feature across many fragments. A modular monolith can provide these boundaries without distributed-system costs.

      Matt Pocock advocates deep modules, drawing on John Ousterhout. A module may be a function, class, package, or larger slice. Interface includes errors, invariants, configuration, and performance, not merely types. These quote snippets are illustrative excerpts, not a runnable package. Ask the deletion test: would removing the module spread its knowledge across callers, or remove empty indirection? Four beats, about 25 seconds each. Sources: https://github.com/mattpocock/skills/blob/main/skills/engineering/codebase-design/SKILL.md and https://github.com/mattpocock/skills/blob/main/skills/engineering/codebase-design/DEEPENING.md
    steps:
      - id: shallow
        label: 'BAD: the caller coordinates the policy'
        panel: shallow-quote
        reveal: &a1
          - description
          - takeaway
      - id: deep
        label: 'GOOD: one capability hides the workflow'
        panel: deep-quote
        reveal: *a1
      - id: seam
        label: The same interface serves callers and tests
        panel: deep-module
        reveal: *a1
      - id: package
        label: Private helpers, explicit public exports
        panel: quote-package
        reveal: *a1
  - id: small-functions
    name: Make policy visible. Prove it stays correct.
    label: CODE DESIGN
    title:
      - text: Make policy visible.
      - accent: Prove it stays correct.
    description: 'BAD → BETTER → VERIFIED: nesting, clear priorities, behavioral examples.'
    code: shipping-nested
    takeaway: Fewer lines are not the goal. Less hidden knowledge is.
    notes: >-
      [5:05–6:50 · 105 seconds]


      Both implementations have cyclomatic complexity C = 6 under a base-one convention counting
      each if and ternary as one decision. The nested version has five if statements; the guard
      version has four if statements and one ternary. Guard clauses reduce nesting, not the
      number of independent paths. Before/after behavior is verified against independent
      expected fees, including express priority over membership and the 4999/5000 threshold.
      Inputs here are already validated; monetary values are cents. The displayed zero-coverage
      CRAP score is a hypothetical baseline, not measured coverage of this repository. This is a
      focused policy example; an external quote interface would usually use named domain inputs
      instead of positional booleans.
    steps:
      - id: nested
        label: 'BAD: nested conditions; coverage assumed absent'
        panel: shipping-nested
        reveal: *a1
      - id: guards
        label: 'BETTER: visible policy priority; same branch count'
        panel: shipping-clear
        reveal: *a1
      - id: tests
        label: 'GOOD: tests protect the priority and threshold'
        panel: shipping-spec
        reveal: *a1
  - id: solid
    name: SOLID makes change more predictable.
    label: CODE DESIGN
    title:
      - text: SOLID makes change
      - accent: more predictable.
    description: Separate responsibilities. Depend on small contracts. Preserve their behavior.
    code: order-store-contract
    takeaway: An interface is a behavioral promise.
    notes: >-
      [6:50–7:50 · 60 seconds]


      Connect SRP to the use case, ISP to the narrow store, DIP to dependency injection, and
      Liskov to equivalent failure and completion behavior. Open/closed leads to the next slide.
      Do not spend time reciting the acronym.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
  - id: patterns
    name: Give extensions a predictable home.
    label: CODE DESIGN
    title:
      - text: Give extensions
      - accent: a predictable home.
    description: Add a strategy or adapter when behavior actually varies. Keep implementation seams private.
    code: notification-strategy
    takeaway: Use a pattern when it clarifies the next change.
    notes: |-
      [7:50–8:50 · 60 seconds]

      The next notification implementation should not require editing a growing branch inside order rules. Pick a pattern for a real variation. Avoid speculative frameworks and inheritance trees. This example is illustrative and has no network implementation.

      Pocock cautions against hypothetical seams: justify real alternatives, often production and test adapters. Patterns should concentrate complexity rather than create pass-through layers. Explore multiple candidate interfaces before choosing one. Source: https://github.com/mattpocock/skills/blob/main/skills/engineering/codebase-design/DESIGN-IT-TWICE.md
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
  - id: risk-signals
    name: CRAP spots risk. It does not certify design.
    label: CODE DESIGN
    title:
      - text: CRAP spots risk.
      - accent: It does not certify design.
    description: The same C = 6 gives 42 at 0% coverage and 6 at 100%. These are worked assumptions.
    code: crap-worked-example
    takeaway: Combine coverage with assertion quality, locality, and coupling.
    notes: >-
      [8:50–10:15 · 85 seconds]


      Original formula: C² × (1 − cov/100)³ + C, with cov expressed as a percentage; the slide
      uses a 0–1 fraction instead. At C=6: cov=0 gives 42; cov=0.5 gives 10.5; cov=1 gives 6.
      The original proposed flag was >30. Its coverage definition is basis-path coverage; tool
      implementations can use different inputs, so record your analyzer and definition. These
      numbers are illustrative, not a repository analyzer report and not an assertion of
      measured 100% basis-path coverage. The new tests protect examples, but a coverage score
      cannot establish their strength. Splitting a method only to lower its score can spread
      complexity. Use cognitive complexity, change hotspots, coupling, dependency checks, and
      selective mutation testing alongside it. Source:
      https://testing.googleblog.com/2011/02/this-code-is-crap.html
    steps:
      - id: formula
        label: Worked CRAP calculation
        reveal: *a1
  - id: housekeeping
    name: Leave the next change easier.
    label: CODE DESIGN
    title:
      - text: Leave the next
      - accent: change easier.
    description: Every PR gets a review and a cleanup pass.
    code: review-and-cleanup
    takeaway: Apply the Boy Scout rule within the change boundary.
    notes: >-
      [10:15–11:05 · 50 seconds]


      Housekeeping is delivery work, not an occasional cleanup sprint. Fix nearby issues that
      help this change. Put broader refactors in a separate stack layer so behavior changes
      remain easy to review.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
  - id: system-map
    name: Architecture is a map of consequences.
    label: SYSTEM ARCHITECTURE
    title:
      - text: Architecture is a map
      - accent: of consequences.
    description: Show ownership, data, dependencies, and failure paths.
    code: introduction
    takeaway: Make the impact of a change visible.
    notes: >-
      [11:05–12:05 · 60 seconds]


      Explain the outbox as an example of an explicit reliability boundary. The order and event
      must be persisted in the same transaction. This diagram is conceptual, not a complete
      implementation. The agent needs the invariants as well as the arrows.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
        panel: order-system
  - id: failure-contracts
    name: Describe failure in the contract.
    label: SYSTEM ARCHITECTURE
    title:
      - text: Describe failure
      - accent: in the contract.
    description: Retries, idempotency, timeouts, cancellation, and compatibility.
    code: delivery-contract
    takeaway: The happy path is only part of the API.
    notes: >-
      [12:05–13:05 · 60 seconds]


      A retry can create duplicate business effects. An idempotencyKey field alone does not
      implement idempotency. State where the decision is persisted atomically and how long keys
      remain valid. Cancellation also does not necessarily undo an external effect.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
  - id: enforced-boundaries
    name: Make illegal dependencies fail.
    label: SYSTEM ARCHITECTURE
    title:
      - text: Make illegal
      - accent: dependencies fail.
    description: Turn architectural intent into checks the agent can run.
    code: architecture-checks
    takeaway: A boundary should be more than a diagram.
    notes: >-
      [13:05–13:50 · 45 seconds]


      Use package exports, dependency-rule tooling, and adapter contract tests. This is
      illustrative policy, not configuration for a named tool. The key is that violations fail a
      repeatable check.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
  - id: repository-context
    name: Make the repository explain itself.
    label: CONTEXT
    title:
      - text: Make the repository
      - accent: explain itself.
    description: Purpose, invariants, examples, and verification commands live near the code.
    code: package-context
    takeaway: Discoverable context beats repeated explanations.
    notes: >-
      [13:50–14:50 · 60 seconds]


      Explain AGENTS.md as scoped repository instructions, skills as reusable workflows, and
      ADRs as records of important decisions. Keep instructions short and current. Commands
      shown here are illustrative for a larger orders repository.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
  - id: token-efficiency
    name: Token efficiency starts with locality.
    label: CONTEXT
    title:
      - text: Token efficiency
      - accent: starts with locality.
    description: Targeted search. Narrow contracts. Useful failure output.
    code: introduction
    takeaway: Optimize tokens per verified outcome.
    notes: >-
      [14:50–15:50 · 60 seconds]


      Do not hide necessary evidence to save tokens. Track retries and review effort. A short
      diff can still require extensive caller and contract context. Large prompts are not
      automatically better, and smaller prompts are not automatically sufficient.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
        panel: context-locality
  - id: executable-intent
    name: A test is executable intent.
    label: TESTING
    title:
      - text: A test is
      - accent: executable intent.
    description: Fast, deterministic tests describe the rule in domain language.
    code: fluent-order-test
    takeaway: Hide infrastructure details, not the behavior.
    notes: >-
      [15:50–16:55 · 65 seconds]


      Relate this to the fluent-tests skill in this repo. The driver owns setup and
      infrastructure, but should not duplicate production logic. This slide is illustrative:
      test, expect, and the domain driver belong to a test project and are not defined here.


      Connect this to Pocock: test observable behavior across the module interface, not
      helper-call order. When deepening a module, replace redundant internal tests only after
      preserving meaningful behavior coverage. Adapter guarantees still need relevant tests.
      Source: https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/tests.md
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
  - id: test-the-tests
    name: Would your tests reject the wrong code?
    label: TESTING
    title:
      - text: Would your tests
      - accent: reject the wrong code?
    description: Boundary cases and independent acceptance criteria expose plausible mistakes.
    code: boundary-test
    takeaway: Coverage is not evidence of strong assertions.
    notes: >-
      [16:55–17:55 · 60 seconds]


      Point to zero as the boundary. Mutation testing deliberately changes implementations and
      asks if tests detect it. Apply it selectively where the value justifies the cost. Source:
      https://stryker-mutator.io/docs/ . We will replay this exact rule in the demo.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
  - id: fast-tests
    name: Fast feedback protects velocity.
    label: TESTING
    title:
      - text: Fast feedback
      - accent: protects velocity.
    description: Keep local checks deterministic and failures actionable.
    code: introduction
    takeaway: A fast, unreliable check is not a feedback loop.
    notes: >-
      [17:55–18:40 · 45 seconds]


      Use isolated state, deterministic async control, and clear expected/actual output. Keep
      full integration coverage, but do not require it for every small hypothesis. Diagnose
      flaky tests instead of teaching agents to rerun until green.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
        panel: feedback-loop
  - id: builds
    name: Fast and reproducible are different promises.
    label: BUILDS & CI
    title:
      - text: Fast and reproducible
      - accent: are different promises.
    description: Make builds repeatable. Then remove unnecessary work.
    code: reproducible-builds
    takeaway: Optimize the loop without weakening the evidence.
    notes: >-
      [18:40–19:40 · 60 seconds]


      A cache can make a wrong build fast if its key omits inputs. A reproducible build can
      still be slow. Pin the toolchain and dependencies, record inputs, and verify clean builds.
      Avoid claiming every affected-package selector detects every cross-package interaction.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
  - id: verification-ladder
    name: Fast feedback is a ladder.
    label: WHEN FEEDBACK IS SLOW
    title:
      - text: Fast feedback
      - accent: is a ladder.
    description: Run cheap falsifiers first. Start expensive checks early.
    code: introduction
    takeaway: Continuing work is not declaring it verified.
    notes: >-
      [19:40–20:45 · 65 seconds]


      Long build cycles can be unavoidable. Use progressively stronger checks. Keep passed,
      running, failed, and not checked distinct. Start remote checks early, avoid redundant
      runs, and retain the required full checks before acceptance.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
        panel: verification-ladder
  - id: overlap-work
    name: Keep coding while checks run.
    label: WHEN FEEDBACK IS SLOW
    title:
      - text: Keep coding
      - accent: while checks run.
    description: A stack separates progress from merge readiness.
    code: introduction
    takeaway: Decouple progress from waiting.
    notes: >-
      [20:45–21:50 · 65 seconds]


      PR A can be under review while B is implemented. This is speculative work until its
      foundations are accepted. If A fails or changes, reassess B and C. Keep stacks shallow
      enough to understand and avoid accumulating work on a failing assumption.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
        panel: stack-overlap
  - id: remote-checks
    name: CI belongs in the coding environment.
    label: WHEN FEEDBACK IS SLOW
    title:
      - text: CI belongs in the
      - accent: coding environment.
    description: Use local, remote, or CI capacity. Read the feedback and close the loop.
    code: remote-verification
    takeaway: A green check belongs to a specific revision.
    notes: >-
      [21:50–23:10 · 80 seconds]


      When a laptop is congested, agents should have a skill to dispatch approved checks to CI
      or a remote development machine, track run IDs, and inspect logs and artifacts. Choose
      based on queue plus setup plus execution plus retrieval time. Remote development supports
      interactive work and persistent caches; CI provides durable, reproducible evidence. Use
      scoped credentials and approved workflows.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
  - id: small-prs
    name: Keep the change inside the review budget.
    label: DELIVERY
    title:
      - text: Keep the change
      - accent: inside the review budget.
    description: One purpose. Bounded dependencies. Explicit acceptance criteria.
    code: introduction
    takeaway: Small diffs can still have large consequences.
    notes: >-
      [23:10–24:00 · 50 seconds]


      Reserve room for related code and reasoning. Separate mechanical refactors from behavior
      changes. A shared-interface change may require much more context than an isolated large
      addition. Do not set a universal line-count rule.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
        panel: review-budget
  - id: reviewable-stack
    name: Stack the work. Keep each review small.
    label: DELIVERY
    title:
      - text: Stack the work.
      - accent: Keep each review small.
    description: Every layer has a purpose, passing checks, and a valid intermediate state.
    code: introduction
    takeaway: Small reviews do not replace integration evidence.
    notes: >-
      [24:00–24:55 · 55 seconds]


      Unlike the overlap slide, focus here on review units and merge mechanics. Dependencies are
      explicit; each PR is reviewed against its immediate parent. Rebase or update descendants
